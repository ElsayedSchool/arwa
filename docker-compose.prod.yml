version: "3.9"

services:
  postgres:
    env_file:
      - ./.env.prod

  redis:
    env_file:
      - ./.env.prod

  backend:
    image: ${BACKEND_IMAGE}
    env_file:
      - ./.env.prod
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    env_file:
      - ./.env.prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
