version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persist DB data on the host so it survives container recreation on EC2
      - ./pgdata:/var/lib/postgresql/data
      # Optional init scripts (SQL or sh) from the repo
      - ./arwa_back/postgresDb:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - ./.env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redisdata:/data

  backend:
    build:
      context: ./arwa_back
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - postgres
      - redis
    # In production we don't mount source code; use image build.  Uncomment the
    # volumes block for local development if needed.
    # volumes:
    #   - ./arwa_back:/usr/app
    command: ["npm", "run", "start:prod"]

  frontend:
    build:
      context: ./arwa
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

# Optional volumes block left empty because we use host directories for persistence
volumes: {}
