services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - ./.env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-arwa_db}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    env_file:
      - ./.env.dev
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./arwa_back
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env.dev
    environment:
      # Ensure dev stage for ConfigModule env resolution
      STAGE: dev
    volumes:
      - ./arwa_back:/usr/app
      - /usr/app/node_modules
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    command: ["npm", "run", "start:dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./arwa
      dockerfile: Dockerfile
    env_file:
      - ./.env.dev
    volumes:
      - ./arwa:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_DEV_PORT:-5174}:${FRONTEND_DEV_PORT:-5174}"
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
