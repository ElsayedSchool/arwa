server {
    listen 80;
    server_name _;

    # If built with base path /arwa/ allow both / and /arwa/ root access.
    # Primary root
    root /usr/share/nginx/html;
    index index.html;

    # Serve assets with long cache (hashed filenames) but no cache for html
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback (handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # (Optional) If you deploy under /arwa/ sub-path while hosting root too
    location /arwa/ {
        try_files $uri $uri/ /arwa/index.html; # when base path assets are nested
    }

    # Security headers (basic set)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip (can be swapped for brotli in a custom image)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
