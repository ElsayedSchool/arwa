server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proper MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security headers
    add_header X-Content-Type-Options nosniff;

    # Serve static assets directly; long cache for hashed assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback - always serve index.html for missing files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: return 404 for favicon if missing
    location = /favicon.ico { try_files $uri =404; }

    # Logs (use default paths inside container)
}
